services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2
    container_name: klawpen-docker-socket-proxy
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EXEC: 1
      BUILD: 1
      POST: 1
      DELETE: 1
      INFO: 1
      VERSION: 1
      PING: 1
      AUTH: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
    networks:
      - klawpen-internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  klawpen-internal:
    name: klawpen-internal
    internal: true
